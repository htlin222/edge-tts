# 朗讀發音詞典 —— normalize.py 讀這個檔
#
# 為什麼需要它：edge-tts 已移除任意 SSML 支援，只剩 --rate/--volume/--pitch。
# 沒有 <break>、沒有 <lang xml:lang="en-US">、沒有 <phoneme>。
# 所以「怎麼唸」只能在送進 TTS 之前用字串替換解決 —— 這個檔就是全部的控制點。
#
# 規則依序套用（由上而下），每條：
#   pattern: 正則（Python re 語法）
#   replace: 取代字串（可用 \1 \2 回引）
#   note:    為什麼要這條 —— 請務必寫，半年後你會忘
#
# 改完跑 `make check` 會在 build/ 產出 diff，讓你看到每條規則實際改了什麼。

rules:
  # ── 細胞遺傳學記號 ────────────────────────────────────────────
  - pattern: '\bt\((\d+);(\d+)\)'
    replace: 't \1 \2 易位'
    note: 't(4;14) → 「t 四 十四 易位」。分號直接唸出來會變「分號」，很吵。

  - pattern: '\bdel\((\d+[pq]\d*)\)'
    replace: '\1 缺失'
    note: 'del(17p) → 「17p 缺失」。del 唸成「德爾」不如直接講中文。'

  - pattern: '\+(\d+[pq]\d+)\b'
    replace: '\1 增幅'
    note: '+1q21 → 「1q21 增幅」。前置加號會被唸成「加」或直接吞掉。'

  - pattern: '\bgain\((\d+[pq]\d*)\)'
    replace: '\1 增幅'
    note: 'gain(1q21) 與 +1q21 同義，統一唸法。'

  - pattern: '\bamp\((\d+[pq]\d*)\)'
    replace: '\1 擴增'
    note: 'amp(1q21) 是比 gain 更高的拷貝數，刻意用不同中文詞區分。'

  - pattern: '\binv\((\d+)\)\(([pq][\d.]+)([pq][\d.]+)\)'
    replace: 'inv \1 倒位'
    note: 'inv(16)(p13.1q22) 的斷點座標唸出來只會製造噪音，只留「inv 16 倒位」。'

  # ── 基因融合記號 ──────────────────────────────────────────────
  - pattern: '::'
    replace: ' '
    note: 'BCR::ABL1 的雙冒號是 HGVS 新式寫法，唸出來是「冒號冒號」。直接吞成空格。'

  - pattern: '(?<=[A-Z0-9])/(?=[A-Z])'
    replace: ' '
    note: 'PML/RARA 這種斜線融合寫法，斜線吞掉。用 lookaround 避免動到數字比率。'

  # ── 希臘字母 ────────────────────────────────────────────────
  - pattern: 'β'
    replace: 'beta '
    note: 'β2-microglobulin 的 β 會被 zh-TW voice 唸成「貝塔」或直接跳過，不穩定。'
  - pattern: 'α'
    replace: 'alpha '
    note: '同上。'
  - pattern: 'γ'
    replace: 'gamma '
    note: '同上。'
  - pattern: 'κ'
    replace: 'kappa '
    note: 'κ light chain。'
  - pattern: 'λ'
    replace: 'lambda '
    note: 'λ light chain。'

  # ── 數學/比較符號 ─────────────────────────────────────────────
  - pattern: '≥'
    replace: '大於等於 '
    note: '符號不唸。'
  - pattern: '≤'
    replace: '小於等於 '
    note: '符號不唸。'
  - pattern: '(?<=\d)\s*[–—]\s*(?=\d)'
    replace: ' 到 '
    note: '55–60% 的 en-dash 是範圍不是減號。只在數字之間才轉，避免動到句中破折號。'
  - pattern: '(?<=\d)%\s*/\s*(?=\d)'
    replace: '%、'
    note: '77%/62%/47% 的斜線是並列，唸「斜線」會斷句錯。'
  - pattern: '~(?=\d)'
    replace: '約 '
    note: '~50% → 「約 50%」。'

  # ── markdown 記號剝除 ────────────────────────────────────────
  - pattern: '\*\*([^*]+)\*\*'
    replace: '\1'
    note: '粗體記號不唸。'
  - pattern: '(?<![\w*])\*([^*\n]+)\*(?![\w*])'
    replace: '\1'
    note: '斜體記號不唸。用 lookaround 避免吃掉 t(4;14) 之類含星號的東西。'
  - pattern: '`([^`]+)`'
    replace: '\1'
    note: '行內 code 記號不唸。'
  - pattern: '^\s*>\s?'
    replace: ''
    note: '引用符號不唸（引用內容本身保留）。'
  - pattern: '^\s*-\s+-\s+'
    replace: ''
    note: |
      「- - t(4;14)：高風險」這種雙 dash 是 TipTap 巢狀清單被壓平的產物，
      全庫 114 年有 88 處，集中在 20 題的「逐項評析」段。唸成「減號減號」很荒謬。

  # ── 連結／引用清理 ───────────────────────────────────────────
  - pattern: 'https?://\S+'
    replace: ''
    note: '內文若殘留裸 URL，唸出來是災難。reference 區段已在 export 階段整段切除。'
  - pattern: '\bdoi:\s*\S+'
    replace: ''
    note: 'DOI 同上。'

  # ── 視覺符號 ────────────────────────────────────────────────
  # 這一整組是最重要的規則。zh-TW voice 遇到這些符號多半「直接跳過不唸」，
  # 於是「葉酸↑B12↓」會被唸成「葉酸 B12」—— 語意整個消失，而且聽的人完全不會察覺。
  # 全庫 114 年：→ 405 次、↓ 39、↑ 26、✓ 14、▍ 9、✗ 6。
  - pattern: '(?<=[\d.])\s*→\s*(?=[\d.])'
    replace: ' 變為 '
    note: |
      數值之間的箭頭是「變化」：「Hgb 7.7 → 5.7 g/dL」。
      刻意不用「降到」——箭頭兩端也可能是上升。
  - pattern: '\s*→\s*'
    replace: '，接著 '
    note: |
      其餘的箭頭是序列或推論：「有近期輸血 → 高度懷疑 DHTR → 做 elution」、
      「保護者 → 通行證 → 收貨員」。「接著」是唯一在兩種語境下都不會製造錯誤語意的詞
      （「則」「導致」會把序列誤讀成因果）。
  - pattern: '\s*←\s*'
    replace: '，來自 '
    note: '反向箭頭只有 1 處，語境是「這格 ← 病人在這裡」。'
  - pattern: '↑'
    replace: '上升'
    note: '「葉酸↑B12↓」「過敏反應 ↓」——檢驗值方向，漏掉就等於沒講。'
  - pattern: '↓'
    replace: '下降'
    note: '同上。'
  - pattern: '[✓✗]\s*(?=正確|錯誤|符合|不符)'
    replace: ''
    note: '「✓ 正確」後面已經有文字了，符號留著會變成「勾 正確」。'
  - pattern: '✓'
    replace: '，正確'
    note: '單獨出現在句尾的勾，例如「(B) Auto control ✓」。'
  - pattern: '✗'
    replace: '，錯誤'
    note: '同上。'
  - pattern: '[▍▎│├└─■□●◆★☆]'
    replace: ''
    note: '純裝飾符號（▍是段落標題的視覺標記），刪掉即可，標題文字本身仍在。'
  - pattern: '(?<=[A-Za-z0-9])\^(?=[A-Za-z0-9])'
    replace: ' '
    note: |
      上標記號：anti-Mi^a（18 次）、Mi^a（15）、anti-Jk^a、anti-Fy^a。
      血型抗原就是唸「anti Mi a」，插入空格讓語音正確斷開。

  # ── 被壓成一行的清單 ─────────────────────────────────────────
  # TipTap 的清單被序列化成 markdown 時，有時整串項目擠在同一行：
  #   「要確認溶血需要以下五項： - LDH（…）：… - Fibrinogen …」
  # 行首的 dash 由 normalize.py 的 strip_markdown 處理掉了，這裡專治行內的那些。
  # 全庫 114 年有 131 處，分布在 30 題 —— 不處理就會唸出一堆「減號」。
  - pattern: '(?<=[：:，。；、])\s*-\s+'
    replace: ''
    note: '前面已經有標點了（「以下五項：」），dash 只是清單記號，直接刪。'
  - pattern: '\s+-\s+(?=[^\s\d])'
    replace: '。'
    note: |
      前面沒有標點的（「…ISTH 得 0 分 - Fibrinogen 24…」），
      dash 是兩個項目之間唯一的分界，要換成句號才有停頓。
      lookahead 排除數字開頭，免得誤傷「5 - 10」這種減號或範圍。

  # ── 中文標點正規化 ───────────────────────────────────────────
  - pattern: '(?<=[一-鿿]),(?=[一-鿿])'
    replace: '，'
    note: |
      114 年 001-066 題的綜論標題與內文混用半形逗號（067 之後才改全形）。
      半形逗號在 zh-TW voice 裡幾乎不產生停頓，整句會連成一氣。轉成全形才有斷句。
  - pattern: '(?<=[一-鿿]);(?=[一-鿿])'
    replace: '；'
    note: '同上，半形分號。'
  - pattern: '(?<=[一-鿿]):(?=[一-鿿])'
    replace: '：'
    note: '同上，半形冒號。注意這條要排在 t(4;14) 等記號規則「之後」，否則會誤傷。'

  # ── 空白收尾 ────────────────────────────────────────────────
  - pattern: '(?<=[一-鿿])[ \t]+(?=[一-鿿])'
    replace: ''
    note: |
      前面的替換會在中文之間留下空白（例如 del(17p) → 「17p 缺失 確實是」）。
      中文之間的空白會產生一個不該有的微停頓。英中之間的空白刻意保留 —— 那個
      停頓反而幫助語音切換到英文詞。
  - pattern: '[ \t]{2,}'
    replace: ' '
    note: '其餘多餘空白收斂成一個。'
  - pattern: '\n{3,}'
    replace: "\n\n"
    note: '連續空行收斂成一個，段落停頓由 synth.py 的分段靜音負責。'

# ── 不做替換、但要知道的事 ──────────────────────────────────────
# 這些是刻意「不處理」的，寫在這裡免得日後有人以為是漏掉：
#
#   R-ISS / R2-ISS  → 保持原樣。voice 會唸成「R I S S」，聽得懂。
#   MRD / CR / FISH / TKI / OS / PFS / HSCT
#                   → 保持原樣。逐字母唸是對的，血液科本來就這樣講。
#   H3K36me2        → 保持原樣。沒有一種寫法能讓它唸得好聽。
#   IGHV / TP53     → 保持原樣。
#   中英混讀        → 不做語言切換。edge-tts 無 SSML，技術上做不到。
#                      zh-TW 男聲唸英文腔調偏硬但可懂，這是已接受的取捨。
